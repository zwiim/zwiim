# Supported providers (Claude, Codex) against the real vendors, through a real
# Host and its managed adapters. Uses dedicated CI-only credentials stored as
# repository secrets; they are never committed and never personal accounts.
# A provider whose secret is missing is reported as not run, and a release
# must not be cut on it (release.yml requires this workflow to pass).
# Unless a dispatch names another, each provider runs its cheapest model at
# low effort: Claude on Haiku, Codex on gpt-6-luna. That covers releases
# and the daily run.
name: Providers

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Which provider to check
        type: choice
        options: [both, claude, codex]
        default: both
      model:
        description: Model for the session (e.g. sonnet); empty runs the cheapest (haiku, gpt-6-luna)
        type: string
        default: ""
      effort:
        description: Effort for the session (e.g. medium); empty runs low
        type: string
        default: ""
  workflow_call:
    secrets:
      ZWIIM_CI_ANTHROPIC_API_KEY:
        required: false
      ZWIIM_CI_OPENAI_API_KEY:
        required: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  live:
    name: ${{ matrix.provider }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON((inputs.provider && inputs.provider != 'both') && format('["{0}"]', inputs.provider) || '["claude","codex"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Credentials present
        env:
          ANTHROPIC: ${{ secrets.ZWIIM_CI_ANTHROPIC_API_KEY }}
          OPENAI: ${{ secrets.ZWIIM_CI_OPENAI_API_KEY }}
        run: |
          case "${{ matrix.provider }}" in
            claude) test -n "$ANTHROPIC" || { echo "::error::ZWIIM_CI_ANTHROPIC_API_KEY is not configured; Claude was not tested"; exit 1; } ;;
            codex)  test -n "$OPENAI"    || { echo "::error::ZWIIM_CI_OPENAI_API_KEY is not configured; Codex was not tested"; exit 1; } ;;
          esac
      - name: Live provider check
        env:
          ZWIIM_LIVE_PROVIDERS: ${{ matrix.provider }}
          ZWIIM_LIVE_MODEL: ${{ inputs.model || (matrix.provider == 'claude' && 'haiku' || 'gpt-6-luna') }}
          ZWIIM_LIVE_EFFORT: ${{ inputs.effort || 'low' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'claude' && secrets.ZWIIM_CI_ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.provider == 'codex' && secrets.ZWIIM_CI_OPENAI_API_KEY || '' }}
          ZWIIM_LIVE_EXPECTED_MODELS_CLAUDE: ${{ vars.ZWIIM_LIVE_EXPECTED_MODELS_CLAUDE }}
          ZWIIM_LIVE_EXPECTED_MODELS_CODEX: ${{ vars.ZWIIM_LIVE_EXPECTED_MODELS_CODEX }}
        run: cargo test -p zwiim-host --test provider_live ${{ matrix.provider }}_live -- --ignored --nocapture --test-threads=1
