# Zwiim — Rust workspace root.
#
# The headless host runtime plus the desktop client's thin native shell. The
# workspace is intentionally minimal: do not split into many crates until a
# Zwiim-owned boundary genuinely requires it (see CLAUDE.md working rules).
[workspace]
resolver = "2"
members = ["runtime/host", "clients/desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

# Upstream-derived: sacp-tokio is vendored (see third_party/codeg/PROVENANCE.md).
[patch.crates-io]
sacp-tokio = { path = "runtime/host/vendor/sacp-tokio" }
