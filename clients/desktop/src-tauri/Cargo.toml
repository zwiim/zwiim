[package]
name = "zwiim-desktop"
version = "0.1.0-rc.5"
description = "Zwiim Desktop: thin native shell around the web UI"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zwiim_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Desktop self-update from signed GitHub Releases (see src/update.rs).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Optional account sign-in (see src/account.rs).
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
# Hosts on the local network: mDNS discovery (see src/lan.rs).
mdns-sd = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
