# Zwiim Cloud — managed connectivity for remote devices.
#
# Control plane and relay only: account ↔ host registry, host presence,
# single-use connection tickets, rendezvous and an opaque relay of the
# Noise-encrypted device tunnel. It never executes host operations and never
# holds host state. Zwiim-owned; nothing here is derived from upstream code.
#
# `proto` (the wire contract shared with the host) builds without the
# `server` feature, so the host depends on this crate for the contract alone.
[package]
name = "zwiim-cloud"
version = "0.1.0"
description = "Zwiim Cloud — host registry, presence, rendezvous and relay"
authors = ["Zwiim"]
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zwiim_cloud"

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:jsonwebtoken",
    "dep:rand",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
    "dep:sha2",
    "dep:subtle",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:tokio-rustls",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "zwiim-cloud"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"

axum = { version = "0.8", features = ["ws"], optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
# Supabase access tokens: HS256 (project JWT secret) or ES256/RS256 (JWKS).
jsonwebtoken = { version = "9", default-features = false, optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs"], optional = true }
# Relay usage store: the restricted `zwiim_cloud` Postgres role (usage.rs).
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
rcgen = "0.13"
ring = "0.17"
